site_name: PrettyData
site_description: >-
  A Python library being developed for visually appealing tables, charts,
  and reports with minimal configuration.
site_url: https://michalszc.github.io/prettydata/
repo_url: https://github.com/michalszc/prettydata
repo_name: michalszc/prettydata
docs_dir: documentation
site_dir: docs
strict: true

theme:
  name: material
  icon:
    logo: material/table
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      custom_templates: documentation/templates
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Core Concepts: getting-started/core-concepts.md
  - Guides:
      - Overview: guides/index.md
  - API Reference:
      - Overview: reference/index.md
  - Examples: examples.md
  - Troubleshooting: troubleshooting.md
  - Release Notes: release-notes.md

extra_css:
  - stylesheets/extra.css
