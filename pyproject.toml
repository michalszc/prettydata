[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabloom"
version = "0.1.0"
description = "A Python library for visually appealing tables, charts, and reports with minimal configuration."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Michal Szczygiel"},
]
keywords = ["tables", "charts", "reports", "pandas", "matplotlib", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pandas>=2.2.0",
    "matplotlib>=3.10.7",
    "openpyxl>=3.1.5",
    "pypdf>=6.0",
]

[project.optional-dependencies]
example = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.7",
]
all = ["tabloom[example]"]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "PyYAML>=6.0",
]
lint = [
    # Keep the CLI and pre-commit hooks on the same Ruff release.
    "ruff==0.14.6",
    "mypy>=1.0.0",
    "pandas-stubs",
    "pre-commit>=3.0.0",
]
build = [
    "build>=1.0.0",
    "twine>=4.0.0",
]
docs = [
    # Keep the compatible MkDocs 1.x documentation toolchain.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.29,<1",
    # PyMdown 12 changed Highlight's constructor; mkdocstrings 0.x uses the old API.
    "pymdown-extensions>=10,<12",
    "nbformat>=5.10,<6",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "build"},
    {include-group = "docs"},
]

[project.urls]
Documentation = "https://michalszc.github.io/tabloom/"
Homepage = "https://github.com/michalszc/tabloom"
Repository = "https://github.com/michalszc/tabloom"
Issues = "https://github.com/michalszc/tabloom/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tabloom", "tabloom.*"]

[tool.setuptools.package-data]
tabloom = ["py.typed"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (E, W), Pyflakes (F), isort (I), and other useful rules
select = ["E", "W", "F", "I", "N", "UP", "YTT", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = [
    # Allow assert statements (needed for tests)
    "S101",
    # Allow magic values in comparisons (common in tests)
    "PLR2004",
    # Avoid conflicts with formatter
    "COM812",
    # Allow print statements in infrastructure scripts
    "T201",
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Per-file ignores for test files
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ARG"]  # Allow asserts, magic values, and unused args in tests

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Automatically detect line ending
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/tabloom"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 97
show_missing = true
